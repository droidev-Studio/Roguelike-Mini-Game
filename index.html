<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>千里走单骑</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="game.css">
    <link rel="stylesheet" href="src/ui/game-ui.css">
    <script>
        (function () {
            const isGitHubPages = window.location.hostname.endsWith('github.io')
            const isLocalDev = ['127.0.0.1', 'localhost', '::1'].includes(window.location.hostname)
            const params = new URLSearchParams(window.location.search)
            if (!isGitHubPages && !isLocalDev) return
            const defaults = {
                seed: '12345',
                artA1A2: '1', artEnemies: '1', artPlayer: '1', artTiles: '1',
                artEffects: '1', artUi: '1', artHud: '1',
                domUi: '1', audio: '1', stateMusic: '1', domWeaponCd: '1',
                pickupMerge: '1', aiTuning: '1', qinqiPhantoms: '1',
                ENABLE_LARGE_MAP_CAMERA: '1', ENABLE_GAME_SETTINGS: '1',
                ENABLE_WEAPON_COOLDOWN_HUD: '1'
            }
            for (const [key, value] of Object.entries(defaults)) {
                if (!params.has(key)) params.set(key, value)
            }
            // Flags below read location.search synchronously. Normalize it in place:
            // reloading here used to loop forever on Pages, which lacked the local flags.
            const search = `?${params.toString()}`
            if (search !== window.location.search) {
                window.history.replaceState(null, '', `${window.location.pathname}${search}${window.location.hash}`)
            }
        })()
    </script>
</head>
<body data-boot-state="loading">
    <div id="bootOverlay" role="status" aria-live="polite">
        <div class="boot-panel">
            <div class="boot-title">Loading Assets</div>
            <div id="bootMessage" class="boot-message">Preparing game runtime...</div>
        </div>
    </div>
    <div id="gameEditorShell" class="game-editor-shell">
        <main class="game-workbench" aria-label="Game preview">
            <div id="gameViewport" class="game-viewport">
                <canvas id="gameCanvas"></canvas>
                <div id="gameUiRoot" class="game-ui-root" aria-live="polite"></div>
            </div>
        </main>
        <aside id="gameEditorSidebar" class="game-editor-sidebar" aria-label="Game Edit Sidebar">
            <div class="editor-loading">Loading editor data...</div>
        </aside>
        <button id="gameEditorToggle" class="game-editor-toggle" type="button" aria-controls="gameEditorSidebar" aria-expanded="false">
            编辑
        </button>
    </div>
    <script src="GameSettings.js"></script>
    <script src="src/rules/CampaignRules.js"></script>
    <script src="AudioManager.js"></script>
    <script src="AssetRuntime.js"></script>
    <script src="SaveManager.js"></script>
    <script type="module" src="src/ui/GameEditorSidebar.js"></script>
    <script src="src/ui/UIBridge.js"></script>
    <script src="game.js"></script>
</body>
</html>
